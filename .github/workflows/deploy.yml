name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # Lets you redeploy the current content without pushing a commit.
  workflow_dispatch:

# The build needs no secrets: lesson files are in the repository and the
# attachments live in object storage, so nothing here touches Cloudflare.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and do not cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Validates every lesson, builds the client, then prerenders one HTML
      # file per route plus 404.html, sitemap.xml and robots.txt. A malformed
      # lesson fails here, and the live site stays on the previous version.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
